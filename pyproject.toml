[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "power-cad-mcp"
version = "0.1.0"
description = "MCP server that lets AI assistants drive AutoCAD (live via COM) or produce DXF drawings headlessly."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "khs0927" }]
keywords = ["mcp", "autocad", "cad", "dxf", "model-context-protocol"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "mcp>=2.2,<3",
  "ezdxf>=1.3",
  "pydantic>=2.7",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
render = ["matplotlib>=3.8"]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6", "matplotlib>=3.8", "pillow>=10"]

[project.scripts]
power-cad-mcp = "power_cad_mcp.__main__:main"

[project.urls]
Repository = "https://github.com/khs0927/power-cad-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/power_cad_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["autocad: requires a running AutoCAD instance on Windows (set POWER_CAD_LIVE_TESTS=1)"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
